[package]
name = "rpg-cli"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "rpg-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.7", features = ["derive"] }
diesel = { version = "2.3.11", features = ["postgres", "uuid"] }
rpassword = "7.3.1"
tonic = "0.14.6"
prost = "0.14.4"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.16"
common = { path = "../common" }