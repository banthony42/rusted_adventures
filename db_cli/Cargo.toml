[package]
name = "db_cli"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.7", features = ["derive"] }
diesel = { version = "2.2.0", features = ["postgres"] }
rpassword = "7.3.1"
tonic = "*"
prost = "*"
tokio = { version = "1.40.0", features = ["full"] }
tokio-stream = "0.1.16"
common = { path = "../common" }