syntax="proto3";
package RPG.package;

enum Species {
  BOUFTOU = 0;
  CRABEDOEUF = 1;
}

enum Classes {
  WARRIOR = 0;
  MAGE = 1;
}

message Coord {
  int64 x = 1;
  int64 y = 2;
}

message Location {
  Coord map = 1;
  Coord cell = 2;
}

message Entity {
  string uuid = 1;
  string name = 2;
  oneof family {
    Species species = 3;
    Classes class = 4;
  };
  Location location = 5;
}