syntax="proto3";
package Authentication;

service Authenticate {
    rpc AuthenticateUser (AuthRequest) returns (AuthReply);
    rpc Logout (LogoutRequest) returns (EmptyReply);
}

message AuthRequest {
    string login = 1;
    string password = 2;
}

message AuthReply {
    string token = 1;
}

message LogoutRequest {
    string login = 1;
    string token = 2;
}

message EmptyReply {   
}