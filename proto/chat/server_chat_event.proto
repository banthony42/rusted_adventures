syntax="proto3";
package RPG.package;

import "chat/chat_events.proto";

enum ServerEventType {
    SRV_INFO = 0;
    SRV_WARN = 1;
    SRV_DANG = 2;
}

message ServerChatEvent {
    oneof event {
        ServerEventType server_event = 1;
        ChatEventType chat_event = 2;
    };
    string text = 3;
    optional string sender = 4;
}