[package]
name = "common"
version = "0.1.0"
edition = "2021"

[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
diesel = { version = "*", features = ["postgres", "uuid"] }
dotenvy = "0.15"
rand = "0.10.2"
tonic = "0.14.6"
prost = "0.14.4"
tonic-prost = "0.14.6"
uuid = "1.15.1"
byteorder = "1.5.0"
serde_json = "1.0.151"
serde = {  version = "1.0.229", features = [ "derive" ] }
diesel_migrations = { version = "2.3.2" , features = [ "postgres" ] }

[dependencies.diesel_geometry]
git = "https://github.com/neeryapp/diesel_geometry.git"

[build-dependencies]
tonic-prost-build = "0.14.6"
