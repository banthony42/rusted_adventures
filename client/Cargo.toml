[package]
name = "client"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rpg-client"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
piston = "0.53.0"
piston2d-graphics = "0.40.0"
piston_window = "0.119.0"
winit = "0.24"
image = "0.23"

tokio = { version = "1.53.1", features = ["full"] }
tonic = "0.14.6"
prost = "0.14.4"
find_folder = "0.3.0"

serde_json = "1.0.151"
serde = {  version = "1.0.229", features = [ "derive" ] }
rand = "0.10.2"
tokio-stream = "0.1.17"

common = { path = "../common" }