[package]
name = "client"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rpg-client"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
find_folder = "0.3.0"
image = "0.23"
piston = "0.53.0"
piston2d-graphics = "0.40.0"
piston_window = "0.119.0"
prost = "0.14.4"
rand = "0.10.2"
serde_json = "1.0.151"
serde = {  version = "1.0.229", features = [ "derive" ] }
thiserror = "2.0.20"
tokio-stream = "0.1.17"
tokio = { version = "1.54.1", features = ["full"] }
tonic = "0.14.6"
winit = "0.24"

common = { path = "../common" }